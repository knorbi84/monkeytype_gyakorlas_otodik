<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monkeytype – 5. osztály</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f2f4;color:#25272b;font:17px/1.7 system-ui,Segoe UI,sans-serif}header{background:#323437;color:#e2b714;padding:32px 24px}header div,main{max-width:1000px;margin:auto}h1{margin:0;font-size:32px;line-height:1.2}header p{color:#ddd;margin:8px 0 0}main{padding:24px 16px 40px}.intro,article{background:white;border:1px solid #dfe1e4;border-radius:12px;padding:24px;margin-bottom:18px}h2{font-size:21px;margin:0 0 14px;line-height:1.3}.num{display:inline-grid;place-items:center;background:#e2b714;color:#242424;width:34px;height:34px;border-radius:8px;margin-right:10px}.passage{white-space:pre-wrap;margin:0 0 20px;color:#181818}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,a.btn{font:600 15px system-ui;display:inline-block;padding:12px 17px;border:0;border-radius:7px;cursor:pointer;text-decoration:none;background:#e2b714;color:#222}a.btn{background:#323437;color:white}button:hover,a.btn:hover{filter:brightness(.92)}button:focus-visible,a:focus-visible{outline:3px solid #807000;outline-offset:3px}.status{font-size:14px;color:#236b36}footer{text-align:center;color:#666;font-size:14px;padding:0 16px 24px}@media(max-width:500px){article,.intro{padding:16px}h1{font-size:26px}} </style></head><body><header><div><h1>⌨ Monkeytype – Gépelési feladatok</h1><p>Digitális kultúra · 5. osztály</p></div></header><main><div id="tasks"></div></main><footer>Gépelési gyakorlatok · 5. osztály</footer><script>
const tasks=[
['Szóköz és ékezetes betűk',`A hegyvidéki túrára mindenki gondosan felkészült. A hátizsákokba szendvicsek, gyümölcsök és kulacsok kerültek. Az erdő sűrű fái között keskeny ösvény vezetett a kilátóhoz. Útközben különböző növényeket és gombákat figyeltek meg a gyerekek. Egy hűvös forrás mellett rövid pihenőt tartottak. A meredek emelkedő után végre elérték a hegytetőt. A kilátóból gyönyörű látvány tárult eléjük. A távolban apró települések, zöldellő mezők és kanyargó folyók látszottak.`],
['Shift, nagy kezdőbetűk és írásjelek',`Vajon ki nyeri az iskolai vetélkedőt? Péter, Zsófia és Bence már izgatottan várják az első kérdést. Magyarország melyik városában található a Parlament? Zsófia azonnal jelentkezik. Budapest! A következő kérdés már nehezebb. Melyik folyó halad át Szegeden? Bence rövid gondolkodás után válaszol: a Tisza. Helyes válasz! Péter közben felírja a megszerzett pontokat. Vajon sikerül megnyerniük a versenyt? Már csak három kérdés van hátra!`],
['Caps Lock be- és kikapcsolása',`Az iskola folyosóján új kiállítás nyílt, amelynek címe: A JÖVŐ TALÁLMÁNYAI. Az első asztalon egy NAPELEMMEL MŰKÖDŐ AUTÓ látható. Mellette egy OKOS ROBOT és egy ELEKTROMOS REPÜLŐGÉP modellje áll. A következő teremben a VILÁGŰR KUTATÁSA a fő téma. A látogatók megismerkedhetnek a NAPRENDSZER BOLYGÓIVAL és a NEMZETKÖZI ŰRÁLLOMÁSSAL. A kijárat mellett egy hatalmas plakát hirdeti a következő programot: TUDOMÁNY ÉS TECHNOLÓGIA. A kiállítás végén minden résztvevő kap egy KUTATÓI OKLEVELET.`],
['Num Lock és numerikus billentyűzet',`Az iskolai sportnapra 125 tanuló jelentkezett. A futóversenyen 48, a kerékpáros versenyen 36, a labdajátékokon pedig 41 diák vett részt. A futópálya hossza 400 méter volt. A kerékpárosoknak 2500 métert kellett megtenniük. A szervezők 150 palack vizet, 85 almát és 95 müzliszeletet készítettek elő. A versenyzők rajtszámai között szerepelt a 102, 247, 358, 469, 571, 683, 794 és 806. Az eredményeket egy számítógépen rögzítették.`],
['Alt Gr és különleges jelek',`Az informatikai szakkörön a különleges karakterek használatát gyakorolták. A csapat e-mail-címe: szakkor@pelda.hu. A robotokat a #101, #202 és #303 azonosítóval jelölték meg. A versenyzőpárok neve Dóra & Márk, valamint Gergő & Réka volt. A számítógép képernyőjén a következő felsorolás jelent meg: monitor; billentyűzet; egér; nyomtató. A programozás során ilyen jelekkel is találkoztak: [ ] { } < > \\ |. A feladat végén a következő karaktersort kellett pontosan begépelni: @ # & ; [ ] { } < > \\ |`],
['Enter és új sor',`A Naprendszer középpontjában a Nap található, amely fényt és hőt biztosít a bolygóknak.
A Merkúr a Naphoz legközelebb keringő bolygó, felszíne tele van kráterekkel.
A Vénusz sűrű légköre miatt rendkívül forró bolygó.
A Föld felszínének nagy részét víz borítja, légköre pedig lehetővé teszi az általunk ismert életet.
A Mars vöröses színét a felszínén található vas-oxid okozza.
A Jupiter a Naprendszer legnagyobb bolygója, a Szaturnusz pedig látványos gyűrűiről ismert.`]];
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}}
tasks.forEach(([title,t],i)=>{const el=document.createElement('article');el.innerHTML=`<h2><span class="num">${i+1}</span></h2><p class="passage"></p><div class="actions"><button type="button">Szöveg másolása</button><span class="status" role="status"></span></div>`;el.querySelector('h2').append(document.createTextNode(title));el.querySelector('.passage').textContent=t;const b=el.querySelector('button'),s=el.querySelector('.status');b.onclick=async()=>{const ok=await copy(t);s.textContent=ok?'✓ Szöveg a vágólapra másolva!':'A másolás nem sikerült. Jelöld ki a szöveget kézzel.'};if(i===5){const p=document.createElement('p');p.textContent='A sorok végén nyomd meg az Entert, ha a Monkeytype megtartja a sortöréseket.';el.insertBefore(p,el.querySelector('.passage'))}document.getElementById('tasks').append(el)});
</script></body></html>
